name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            artifact: FIM-Guard-Linux-x64.tar.gz
          - os: windows-latest
            platform: Windows
            artifact: FIM-Guard-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-x64
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: packages
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages/* --verify-tag --generate-notes --title "FIM Guard $RELEASE_TAG"
